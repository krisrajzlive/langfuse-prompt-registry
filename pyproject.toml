[project]
name = "prompt-registry"
version = "0.1.0"
description = "Langfuse-backed prompt registry and tracing for LangChain applications"
requires-python = ">=3.11"
dependencies = [
    "langfuse>=3.0.0",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
prompt-registry = "prompt_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Langfuse instance and valid API keys"]
addopts = "-m \"not integration\""

[tool.ruff]
line-length = 100
